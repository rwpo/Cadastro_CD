<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💿 Cadastro de CD - Acervo Digital</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Font: Inter & Montserrat -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Montserrat', 'sans-serif'],
          },
          colors: {
            metal: {
              900: '#0d0e12',
              800: '#16181f',
              700: '#232733',
              600: '#32384a',
              500: '#485069',
              accent: '#e63946',
              gold: '#d4af37',
              silver: '#c0c0c0'
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background: radial-gradient(circle at top, #1c1e26 0%, #0d0e12 100%);
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }
    
    .glass-card {
      background: rgba(22, 24, 31, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }

    .cd-spin {
      animation: spin 12s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0d0e12; }
    ::-webkit-scrollbar-thumb { background: #32384a; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #485069; }
  </style>
</head>
<body class="bg-metal-900 text-gray-200 antialiased min-h-screen flex flex-col pb-12">

  <!-- TOP HEADER -->
  <header class="border-b border-metal-700 bg-metal-800/90 sticky top-0 z-40 backdrop-blur-md shadow-lg">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
      
      <!-- Title with Spinning CD -->
      <div class="flex items-center gap-3">
        <div class="relative flex items-center justify-center">
          <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-metal-silver via-gray-400 to-metal-gold p-0.5 shadow-md cd-spin">
            <div class="w-full h-full bg-metal-900 rounded-full flex items-center justify-center border border-gray-700">
              <div class="w-3 h-3 bg-metal-gold rounded-full border border-gray-900"></div>
            </div>
          </div>
          <i class="fa-solid fa-compact-disc absolute text-xl text-metal-gold opacity-90"></i>
        </div>
        <div>
          <h1 class="text-2xl font-black font-display tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-gray-100 via-gray-300 to-metal-gold">
            CADASTRO DE CD
          </h1>
          <p class="text-xs text-gray-400 font-medium">Acervo Digital de Rock, Metal & Além</p>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <nav class="flex items-center gap-2 bg-metal-900/80 p-1.5 rounded-xl border border-metal-700">
        <button id="tab-catalog-btn" onclick="switchTab('catalog')" class="px-4 py-2 rounded-lg font-semibold text-sm transition-all duration-200 bg-metal-700 text-white shadow">
          <i class="fa-solid fa-record-vinyl mr-2 text-metal-gold"></i>Coleção
        </button>
        <button id="tab-stats-btn" onclick="switchTab('stats')" class="px-4 py-2 rounded-lg font-semibold text-sm transition-all duration-200 text-gray-400 hover:text-white">
          <i class="fa-solid fa-chart-pie mr-2 text-metal-accent"></i>Estatísticas
        </button>
      </nav>

    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 flex-grow w-full">

    <!-- CATALOG SECTION -->
    <section id="section-catalog" class="space-y-6">
      
      <!-- Filter, Sort and View Toolbar -->
      <div class="glass-card p-4 rounded-2xl flex flex-col lg:flex-row gap-4 items-center justify-between">
        
        <!-- Search Input -->
        <div class="relative w-full lg:w-72">
          <i class="fa-solid fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400"></i>
          <input type="text" id="filter-search" oninput="renderCatalog()" placeholder="Filtrar por álbum, artista..." class="w-full pl-10 pr-4 py-2 bg-metal-900 border border-metal-700 rounded-xl text-sm focus:outline-none focus:border-metal-gold transition text-gray-200">
        </div>

        <div class="flex flex-wrap items-center gap-3 w-full lg:w-auto">
          
          <!-- Sort Selector -->
          <div class="flex items-center gap-1.5 bg-metal-900 border border-metal-700 rounded-xl px-2 py-1">
            <i class="fa-solid fa-arrow-down-a-z text-metal-gold text-xs pl-1"></i>
            <select id="sort-order" onchange="renderCatalog()" class="bg-transparent text-sm text-gray-300 focus:outline-none pr-1">
              <option value="title" class="bg-metal-900">Ordem Alfabética (Álbum)</option>
              <option value="artist" class="bg-metal-900">Ordem Alfabética (Artista)</option>
              <option value="genre" class="bg-metal-900">Gênero (A-Z)</option>
              <option value="year-desc" class="bg-metal-900">Ano (Mais Recentes)</option>
              <option value="year-asc" class="bg-metal-900">Ano (Mais Antigos)</option>
            </select>
          </div>

          <!-- Genre Filter -->
          <select id="filter-genre" onchange="renderCatalog()" class="bg-metal-900 border border-metal-700 rounded-xl px-3 py-2 text-sm text-gray-300 focus:outline-none focus:border-metal-gold">
            <option value="">Todos os Gêneros</option>
          </select>

          <!-- Country Filter -->
          <select id="filter-country" onchange="renderCatalog()" class="bg-metal-900 border border-metal-700 rounded-xl px-3 py-2 text-sm text-gray-300 focus:outline-none focus:border-metal-gold">
            <option value="">Todos os Países</option>
          </select>

          <!-- View Selector -->
          <div class="flex bg-metal-900 border border-metal-700 rounded-xl p-1 gap-1">
            <button id="view-grid-btn" onclick="setViewMode('grid')" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-metal-700 text-white shadow">
              <i class="fa-solid fa-th-large"></i>
            </button>
            <button id="view-shelf-btn" onclick="setViewMode('shelf')" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-400 hover:text-white">
              <i class="fa-solid fa-list"></i>
            </button>
          </div>

        </div>
      </div>

      <!-- Catalog List / Grid Container -->
      <div id="catalog-container"></div>
    </section>

    <!-- STATISTICS SECTION -->
    <section id="section-stats" class="space-y-6 hidden">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="glass-card p-5 rounded-2xl flex items-center gap-4">
          <div class="w-12 h-12 rounded-xl bg-metal-700 flex items-center justify-center text-metal-gold text-2xl">
            <i class="fa-solid fa-compact-disc"></i>
          </div>
          <div>
            <p class="text-xs text-gray-400 uppercase font-bold tracking-wider">Total de CDs</p>
            <h3 id="stat-total-cds" class="text-2xl font-black text-white">0</h3>
          </div>
        </div>

        <div class="glass-card p-5 rounded-2xl flex items-center gap-4">
          <div class="w-12 h-12 rounded-xl bg-metal-700 flex items-center justify-center text-red-400 text-2xl">
            <i class="fa-solid fa-users"></i>
          </div>
          <div>
            <p class="text-xs text-gray-400 uppercase font-bold tracking-wider">Artistas / Bandas</p>
            <h3 id="stat-total-artists" class="text-2xl font-black text-white">0</h3>
          </div>
        </div>

        <div class="glass-card p-5 rounded-2xl flex items-center gap-4">
          <div class="w-12 h-12 rounded-xl bg-metal-700 flex items-center justify-center text-blue-400 text-2xl">
            <i class="fa-solid fa-earth-americas"></i>
          </div>
          <div>
            <p class="text-xs text-gray-400 uppercase font-bold tracking-wider">Países Representados</p>
            <h3 id="stat-total-countries" class="text-2xl font-black text-white">0</h3>
          </div>
        </div>

        <div class="glass-card p-5 rounded-2xl flex items-center gap-4">
          <div class="w-12 h-12 rounded-xl bg-metal-700 flex items-center justify-center text-green-400 text-2xl">
            <i class="fa-solid fa-layer-group"></i>
          </div>
          <div>
            <p class="text-xs text-gray-400 uppercase font-bold tracking-wider">Gêneros</p>
            <h3 id="stat-total-genres" class="text-2xl font-black text-white">0</h3>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="glass-card p-6 rounded-2xl space-y-4">
          <h3 class="text-lg font-bold text-gray-100 flex items-center gap-2">
            <i class="fa-solid fa-chart-pie text-metal-gold"></i> Distribuição por Gênero
          </h3>
          <div class="relative h-64 w-full flex items-center justify-center">
            <canvas id="chart-genres"></canvas>
          </div>
        </div>

        <div class="glass-card p-6 rounded-2xl space-y-4">
          <h3 class="text-lg font-bold text-gray-100 flex items-center gap-2">
            <i class="fa-solid fa-flag text-red-400"></i> Álbuns por País de Origem
          </h3>
          <div class="relative h-64 w-full flex items-center justify-center">
            <canvas id="chart-countries"></canvas>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- DETAILS / TRACKLIST MODAL -->
  <div id="details-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="glass-card w-full max-w-2xl rounded-2xl p-6 relative border border-metal-700 space-y-4 max-h-[90vh] flex flex-col">
      <button onclick="closeModal('details-modal')" class="absolute top-4 right-4 text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
      <div id="details-content" class="overflow-y-auto pr-1 space-y-4"></div>
    </div>
  </div>

    window.addEventListener('load', () => {
      loadCatalog();
      renderCatalog();
      populateFilterOptions();
      initCharts();
    });

    async function loadCatalog() {
      try {
        // Tenta buscar o arquivo JSON atualizado do repositório
        const response = await fetch('cds.json?t=' + Date.now()); // '?t=' evita cache do navegador
        if (!response.ok) throw new Error('Arquivo não encontrado');
        cdCatalog = await response.json();
      } catch (e) {
        // Fallback caso o arquivo ainda não exista
        cdCatalog = [
          {
            id: "cd-1",
            title: "Master of Puppets",
            artist: "Metallica",
            genre: "Thrash Metal",
            year: 1986,
            country: "Estados Unidos",
            cover: "https://upload.wikimedia.org/wikipedia/en/b/b2/Metallica_-_Master_of_Puppets_cover.jpg",
            tracks: ["Battery", "Master of Puppets", "The Thing That Should Not Be", "Welcome Home (Sanitarium)", "Disposable Heroes", "Leper Messiah", "Orion", "Damage, Inc."]
          }
        ];
      }
      renderCatalog();
      populateFilterOptions();
      updateStatistics();
    }

    function renderCatalog() {
      const container = document.getElementById('catalog-container');
      const searchQuery = document.getElementById('filter-search').value.toLowerCase().trim();
      const genreQuery = document.getElementById('filter-genre').value;
      const countryQuery = document.getElementById('filter-country').value;
      const sortOption = document.getElementById('sort-order').value;

      let filtered = cdCatalog.filter(cd => {
        const matchesSearch = cd.title.toLowerCase().includes(searchQuery) || cd.artist.toLowerCase().includes(searchQuery);
        const matchesGenre = !genreQuery || cd.genre === genreQuery;
        const matchesCountry = !countryQuery || cd.country === countryQuery;
        return matchesSearch && matchesGenre && matchesCountry;
      });

      filtered.sort((a, b) => {
        if (sortOption === 'title') return a.title.localeCompare(b.title, 'pt', { sensitivity: 'base' });
        if (sortOption === 'artist') return a.artist.localeCompare(b.artist, 'pt', { sensitivity: 'base' });
        if (sortOption === 'genre') return (a.genre || '').localeCompare(b.genre || '', 'pt', { sensitivity: 'base' });
        if (sortOption === 'year-desc') return (b.year || 0) - (a.year || 0);
        if (sortOption === 'year-asc') return (a.year || 0) - (b.year || 0);
        return 0;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="glass-card p-12 rounded-2xl text-center space-y-4">
            <i class="fa-solid fa-compact-disc text-5xl text-gray-600"></i>
            <h3 class="text-xl font-bold text-gray-300">Nenhum CD encontrado</h3>
          </div>
        `;
        return;
      }

      if (viewMode === 'grid') {
        container.className = "grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6";
        container.innerHTML = filtered.map(cd => `
          <div class="glass-card rounded-2xl overflow-hidden hover:border-metal-gold/40 transition-all duration-300 flex flex-col group relative">
            <div class="relative aspect-square w-full bg-metal-900 overflow-hidden cursor-pointer" onclick="openDetailsModal('${cd.id}')">
              <img src="${cd.cover || 'https://placehold.co/400x400/232733/c0c0c0?text=Sem+Capa'}" 
                   alt="${cd.title}" 
                   onerror="this.src='https://placehold.co/400x400/232733/c0c0c0?text=Sem+Capa'"
                   class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
              <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                <span class="px-3 py-1.5 rounded-xl bg-metal-800/90 text-xs font-bold text-white border border-metal-600">
                  <i class="fa-solid fa-eye mr-1"></i> Ver Faixas
                </span>
              </div>
              ${cd.country ? `<span class="absolute top-2 right-2 bg-metal-900/80 backdrop-blur-md border border-metal-700 text-xs px-2 py-0.5 rounded-md font-semibold text-gray-300"><i class="fa-solid fa-flag text-red-400 mr-1"></i>${cd.country}</span>` : ''}
            </div>
            <div class="p-4 flex-grow flex flex-col justify-between space-y-2">
              <div>
                <span class="text-[10px] font-bold uppercase tracking-wider text-metal-gold bg-metal-900/60 px-2 py-0.5 rounded border border-metal-700/50">${cd.genre || 'Desconhecido'}</span>
                <h3 class="text-base font-bold text-white leading-snug line-clamp-1 mt-1">${cd.title}</h3>
                <p class="text-sm font-medium text-gray-400 line-clamp-1">${cd.artist}</p>
                <p class="text-xs text-gray-500">${cd.year || 'Ano N/A'}</p>
              </div>
            </div>
          </div>
        `).join('');
      } else {
        container.className = "space-y-3";
        container.innerHTML = filtered.map(cd => `
          <div class="glass-card p-4 rounded-xl flex items-center justify-between gap-4 hover:border-metal-gold/30 transition cursor-pointer" onclick="openDetailsModal('${cd.id}')">
            <div class="flex items-center gap-4 min-w-0">
              <img src="${cd.cover || 'https://placehold.co/100x100/232733/c0c0c0?text=CD'}" alt="${cd.title}" class="w-14 h-14 rounded-lg object-cover flex-shrink-0 border border-metal-700">
              <div class="min-w-0">
                <h4 class="text-base font-bold text-white truncate">${cd.title}</h4>
                <p class="text-xs text-gray-400 truncate">${cd.artist} • <span class="text-metal-gold">${cd.genre || 'Gênero N/A'}</span></p>
                <p class="text-[11px] text-gray-500">${cd.year ? cd.year + ' • ' : ''}${cd.country || 'País N/A'}</p>
              </div>
            </div>
          </div>
        `).join('');
      }
    }

    function setViewMode(mode) {
      viewMode = mode;
      document.getElementById('view-grid-btn').className = mode === 'grid' ? "px-3 py-1.5 rounded-lg text-xs font-semibold bg-metal-700 text-white shadow" : "px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-400 hover:text-white";
      document.getElementById('view-shelf-btn').className = mode === 'shelf' ? "px-3 py-1.5 rounded-lg text-xs font-semibold bg-metal-700 text-white shadow" : "px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-400 hover:text-white";
      renderCatalog();
    }

    function switchTab(tab) {
      document.getElementById('section-catalog').classList.toggle('hidden', tab !== 'catalog');
      document.getElementById('section-stats').classList.toggle('hidden', tab !== 'stats');
      document.getElementById('tab-catalog-btn').className = tab === 'catalog' ? "px-4 py-2 rounded-lg font-semibold text-sm bg-metal-700 text-white shadow" : "px-4 py-2 rounded-lg font-semibold text-sm text-gray-400 hover:text-white";
      document.getElementById('tab-stats-btn').className = tab === 'stats' ? "px-4 py-2 rounded-lg font-semibold text-sm bg-metal-700 text-white shadow" : "px-4 py-2 rounded-lg font-semibold text-sm text-gray-400 hover:text-white";
      if (tab === 'stats') updateStatistics();
    }

    function populateFilterOptions() {
      const genreSelect = document.getElementById('filter-genre');
      const countrySelect = document.getElementById('filter-country');
      const genres = [...new Set(cdCatalog.map(cd => cd.genre).filter(Boolean))].sort();
      const countries = [...new Set(cdCatalog.map(cd => cd.country).filter(Boolean))].sort();

      genreSelect.innerHTML = '<option value="">Todos os Gêneros</option>' + genres.map(g => `<option value="${g}">${g}</option>`).join('');
      countrySelect.innerHTML = '<option value="">Todos os Países</option>' + countries.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    async function openDetailsModal(id) {
      const cd = cdCatalog.find(item => item.id === id);
      if (!cd) return;

      const detailsContainer = document.getElementById('details-content');
      detailsContainer.innerHTML = `
        <div class="flex flex-col md:flex-row gap-6 items-start">
          <img src="${cd.cover || 'https://placehold.co/300x300/232733/c0c0c0?text=Sem+Capa'}" class="w-full md:w-48 aspect-square rounded-2xl object-cover border border-metal-700 shadow-xl">
          <div class="space-y-2 flex-grow">
            <span class="text-xs font-bold text-metal-gold uppercase tracking-wider">${cd.genre || 'Gênero Não Especificado'}</span>
            <h2 class="text-2xl font-black text-white">${cd.title}</h2>
            <p class="text-lg font-semibold text-gray-300">${cd.artist}</p>
            <div class="flex flex-wrap gap-4 text-xs text-gray-400 pt-2">
              <span><i class="fa-solid fa-calendar mr-1"></i> ${cd.year || 'N/A'}</span>
              <span><i class="fa-solid fa-flag text-red-400 mr-1"></i> ${cd.country || 'N/A'}</span>
              <span><i class="fa-solid fa-music mr-1"></i> ${cd.tracks ? cd.tracks.length : 0} faixas</span>
            </div>
          </div>
        </div>

        <div class="pt-4 border-t border-metal-700">
          <h4 class="text-sm font-bold text-gray-200 uppercase tracking-wider mb-3 flex items-center gap-2">
            <i class="fa-solid fa-list-ol text-metal-gold"></i> Faixas do Álbum
          </h4>
          ${cd.tracks && cd.tracks.length > 0 ? `
            <ul class="space-y-2 text-sm">
              ${cd.tracks.map((track, idx) => `
                <li class="p-2.5 rounded-xl bg-metal-900/60 border border-metal-800 flex justify-between items-center group">
                  <span class="text-gray-300 font-medium">${idx + 1}. ${track}</span>
                  <button onclick="fetchLyrics('${cd.artist.replace(/'/g, "\\'")}', '${track.replace(/'/g, "\\'")}')" class="text-xs text-metal-gold opacity-80 group-hover:opacity-100 hover:underline">
                    <i class="fa-solid fa-align-left mr-1"></i> Letra
                  </button>
                </li>
              `).join('')}
            </ul>
          ` : `<p class="text-xs text-gray-500 italic">Nenhuma faixa cadastrada para este álbum.</p>`}
        </div>

        <div id="lyrics-box" class="hidden mt-4 p-4 rounded-xl bg-metal-900 border border-metal-700 space-y-2">
          <div class="flex justify-between items-center">
            <h5 id="lyrics-title" class="text-xs font-bold text-metal-gold uppercase"></h5>
            <button onclick="document.getElementById('lyrics-box').classList.add('hidden')" class="text-gray-400 text-xs">Fechar</button>
          </div>
          <pre id="lyrics-body" class="text-xs text-gray-300 whitespace-pre-wrap font-sans max-h-48 overflow-y-auto"></pre>
        </div>
      `;

      openModal('details-modal');
    }

    async function fetchLyrics(artist, track) {
      const box = document.getElementById('lyrics-box');
      const titleEl = document.getElementById('lyrics-title');
      const bodyEl = document.getElementById('lyrics-body');

      box.classList.remove('hidden');
      titleEl.textContent = `Letra: ${track} - ${artist}`;
      bodyEl.textContent = "Buscando letra da música...";

      try {
        const response = await fetch(`https://lrclib.net/api/get?artist_name=${encodeURIComponent(artist)}&track_name=${encodeURIComponent(track)}`);
        if (!response.ok) throw new Error();
        const data = await response.json();
        bodyEl.textContent = data.plainLyrics || "Letra não encontrada para esta faixa.";
      } catch (err) {
        bodyEl.textContent = "Letra não encontrada para esta faixa.";
      }
    }

    function initCharts() {
      const genreCtx = document.getElementById('chart-genres').getContext('2d');
      const countryCtx = document.getElementById('chart-countries').getContext('2d');

      genreChart = new Chart(genreCtx, {
        type: 'doughnut',
        data: { labels: [], datasets: [{ data: [], backgroundColor: ['#e63946', '#d4af37', '#3a86ff', '#8338ec', '#fb5607', '#06d6a0'] }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#cbd5e1', font: { family: 'Inter', size: 11 } } } } }
      });

      countryChart = new Chart(countryCtx, {
        type: 'bar',
        data: { labels: [], datasets: [{ label: 'Álbuns', data: [], backgroundColor: '#d4af37', borderRadius: 8 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#cbd5e1' }, grid: { display: false } }, y: { ticks: { color: '#cbd5e1', stepSize: 1 }, grid: { color: 'rgba(255,255,255,0.05)' } } } }
      });

      updateStatistics();
    }

    function updateStatistics() {
      document.getElementById('stat-total-cds').textContent = cdCatalog.length;
      document.getElementById('stat-total-artists').textContent = new Set(cdCatalog.map(c => c.artist).filter(Boolean)).size;
      document.getElementById('stat-total-countries').textContent = new Set(cdCatalog.map(c => c.country).filter(Boolean)).size;
      document.getElementById('stat-total-genres').textContent = new Set(cdCatalog.map(c => c.genre).filter(Boolean)).size;

      const genreCounts = {};
      cdCatalog.forEach(cd => { const g = cd.genre || 'Outros'; genreCounts[g] = (genreCounts[g] || 0) + 1; });
      if (genreChart) { genreChart.data.labels = Object.keys(genreCounts); genreChart.data.datasets[0].data = Object.values(genreCounts); genreChart.update(); }

      const countryCounts = {};
      cdCatalog.forEach(cd => { const c = cd.country || 'Não Informado'; countryCounts[c] = (countryCounts[c] || 0) + 1; });
      if (countryChart) { countryChart.data.labels = Object.keys(countryCounts); countryChart.data.datasets[0].data = Object.values(countryCounts); countryChart.update(); }
    }

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
  </script>
</body>
</html>
